# Default:            docker compose up -d           -> Postgres + Redis + MinIO (run the apps with `yarn dev`)
# Everything:         docker compose --profile app up --build
# Demo data:          yarn seed:demo                 (talks to the exposed Postgres on localhost:5432)

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_DB: ${DB_NAME:-event_management}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-event_management}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    # S3-compatible object store standing in for AWS S3 in local development. Event images are
    # uploaded straight from the browser to it with presigned POSTs, exactly as they are to S3.
    # Console: http://localhost:9001. The credentials below are local-only defaults, not AWS keys.
    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
            # The browser POSTs cross-origin from the web app.
            MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot: creates the bucket, serves events/* anonymously (like CloudFront does in AWS) and
    # expires abandoned uploads under tmp/ after a day (same rules as terraform/main.tf).
    minio-init:
        image: minio/mc:RELEASE.2025-04-16T18-13-26Z
        depends_on:
            minio: { condition: service_healthy }
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
            S3_BUCKET: ${S3_BUCKET:-eventeer-images}
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
            mc mb --ignore-existing local/$$S3_BUCKET &&
            mc anonymous set download local/$$S3_BUCKET/events &&
            (mc ilm rule add --expire-days 1 --prefix tmp/ local/$$S3_BUCKET || true)
            "
        restart: "no"

    backend:
        profiles: [app]
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        ports:
            - "4000:4000"
        environment:
            # Not "production": this stack runs over plain http on localhost, where Secure cookies
            # and the https-only FRONTEND_URL check would (correctly) refuse to work.
            NODE_ENV: development
            PORT: 4000
            FRONTEND_URL: http://localhost:3000
            DB_HOST: postgres
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-postgres}
            DB_NAME: ${DB_NAME:-event_management}
            REDIS_HOST: redis
            # Empty Stripe keys = mock payments; pair with an empty NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY.
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
            # Event image uploads -> the MinIO service above. The API reaches it over the compose
            # network; the BROWSER posts to the host-published port.
            S3_BUCKET: ${S3_BUCKET:-eventeer-images}
            S3_REGION: us-east-1
            S3_ENDPOINT: http://minio:9000
            S3_PUBLIC_ENDPOINT: http://localhost:9000
            S3_FORCE_PATH_STYLE: "true"
            S3_PUBLIC_BASE_URL: http://localhost:9000/${S3_BUCKET:-eventeer-images}
            # The AWS SDK reads these itself. Here they are MinIO's root credentials; in AWS use a role.
            AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
            AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
            minio-init: { condition: service_completed_successfully }

    frontend:
        profiles: [app]
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            args:
                # The BROWSER calls these, so they are host-visible URLs (and baked in at build time).
                NEXT_PUBLIC_API_URL: http://localhost:4000
                NEXT_PUBLIC_WS_URL: http://localhost:4000
                NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        ports:
            - "3000:3000"
        environment:
            # The Next.js SERVER reaches the API over the compose network.
            API_INTERNAL_URL: http://backend:4000
        depends_on:
            - backend

volumes:
    postgres_data:
    redis_data:
    minio_data:
