# Default:            docker compose up -d           -> Postgres + Redis only (run the apps with `yarn dev`)
# Everything:         docker compose --profile app up --build
# Demo data:          yarn seed:demo                 (talks to the exposed Postgres on localhost:5432)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-event_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-event_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      # Not "production": this stack runs over plain http on localhost, where Secure cookies
      # and the https-only FRONTEND_URL check would (correctly) refuse to work.
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-event_management}
      REDIS_HOST: redis
      # Empty Stripe keys = mock payments; pair with an empty NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # The BROWSER calls these, so they are host-visible URLs (and baked in at build time).
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    environment:
      # The Next.js SERVER reaches the API over the compose network.
      API_INTERNAL_URL: http://backend:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
