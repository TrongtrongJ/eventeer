# EXAMPLE ONLY. Never commit real values: create the real Secrets out-of-band
# (sealed-secrets / external-secrets / `kubectl create secret`). secrets.yaml is git-ignored.
apiVersion: v1
kind: Secret
metadata:
    name: postgres-secret
    namespace: event-management
type: Opaque
stringData:
    username: postgres
    password: change_me_in_production

---
apiVersion: v1
kind: Secret
metadata:
    name: stripe-secret
    namespace: event-management
type: Opaque
stringData:
    secret-key: sk_test_your_secret_key
    webhook-secret: whsec_your_webhook_secret

---
apiVersion: v1
kind: Secret
metadata:
    name: smtp-secret
    namespace: event-management
type: Opaque
stringData:
    username: your-email@gmail.com
    password: your-app-password

---
# Optional: only the providers you enable. The backend reads these as optional, so omit the Secret
# (or leave a provider's keys empty) to switch that sign-in method off.
apiVersion: v1
kind: Secret
metadata:
    name: oauth-secret
    namespace: event-management
type: Opaque
stringData:
    google-client-id: ""
    google-client-secret: ""
    github-client-id: ""
    github-client-secret: ""
    facebook-app-id: ""
    facebook-app-secret: ""
