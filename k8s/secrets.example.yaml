# EXAMPLE ONLY. Never commit real values: create the real Secrets out-of-band
# (sealed-secrets / external-secrets / `kubectl create secret`). secrets.yaml is git-ignored.
apiVersion: v1
kind: Secret
metadata:
    name: postgres-secret
    namespace: event-management
type: Opaque
stringData:
    username: postgres
    password: change_me_in_production

---
apiVersion: v1
kind: Secret
metadata:
    name: stripe-secret
    namespace: event-management
type: Opaque
stringData:
    secret-key: sk_test_your_secret_key
    webhook-secret: whsec_your_webhook_secret

---
apiVersion: v1
kind: Secret
metadata:
    name: smtp-secret
    namespace: event-management
type: Opaque
stringData:
    username: your-email@gmail.com
    password: your-app-password

---
# Only for clusters that CANNOT use IRSA / pod identity (prefer the role: no long-lived keys).
# Do NOT apply this one on an IRSA cluster: the placeholder keys below would override the role.
# The IAM user needs only s3:PutObject/GetObject/DeleteObject on the images bucket (see terraform/main.tf).
apiVersion: v1
kind: Secret
metadata:
    name: aws-s3-secret
    namespace: event-management
type: Opaque
stringData:
    access-key-id: AKIAEXAMPLEPLACEHOLDER
    secret-access-key: example-secret-access-key-placeholder
