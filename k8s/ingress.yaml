# One host, two Ingresses. Everything is same-origin, which is what makes the httpOnly,
# SameSite=Lax auth cookies first-party and lets the web app's middleware read them.
#
#   /api/*        -> backend  (prefix stripped: /api/auth/login -> /auth/login)
#   /socket.io/*  -> backend  (live seat updates; not rewritten)
#   /*            -> frontend
#
# Build the web image with NEXT_PUBLIC_API_URL=https://<host>/api and NEXT_PUBLIC_WS_URL=https://<host>.
# Stripe webhook endpoint to register: https://<host>/api/payment/webhook
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventeer-api
  namespace: event-management
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts: [event-management.example.com]
    secretName: event-management-tls
  rules:
  - host: event-management.example.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventeer-web
  namespace: event-management
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Long-lived websocket connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [event-management.example.com]
    secretName: event-management-tls
  rules:
  - host: event-management.example.com
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
