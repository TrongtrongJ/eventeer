apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: event-management
spec:
    replicas: 3
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            # IRSA: gives the pods S3 access through an IAM role with no stored keys (see serviceaccount.yaml).
            serviceAccountName: backend
            containers:
                - name: backend
                  image: eventeer-api:0.1.0 # pin an immutable tag (never :latest)
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: PORT
                        value: "4000"
                      - name: FRONTEND_URL
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: frontend-url
                      - name: TRUST_PROXY
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: trust-proxy
                      - name: DB_HOST
                        value: postgres
                      - name: DB_PORT
                        value: "5432"
                      - name: DB_NAME
                        value: event_management
                      - name: DB_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: username
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: password
                      - name: REDIS_HOST
                        value: redis
                      - name: REDIS_PORT
                        value: "6379"
                      - name: STRIPE_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                name: stripe-secret
                                key: secret-key
                      - name: STRIPE_WEBHOOK_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: stripe-secret
                                key: webhook-secret
                      - name: SMTP_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: smtp-host
                      - name: SMTP_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: smtp-port
                      - name: SMTP_USER
                        valueFrom:
                            secretKeyRef:
                                name: smtp-secret
                                key: username
                      - name: SMTP_PASS
                        valueFrom:
                            secretKeyRef:
                                name: smtp-secret
                                key: password
                      - name: S3_BUCKET
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: s3-bucket
                      - name: S3_REGION
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: s3-region
                      - name: S3_PUBLIC_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: s3-public-base-url
                      # Only for clusters WITHOUT IRSA / pod identity. Skipped when the Secret is absent,
                      # in which case the SDK falls back to the pod's role credentials.
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: aws-s3-secret
                                key: access-key-id
                                optional: true
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: aws-s3-secret
                                key: secret-access-key
                                optional: true
                      - name: FEATURE_EMAIL_ENABLED
                        value: "true"
                      - name: FEATURE_PAYMENT_ENABLED
                        value: "true"
                  ports:
                      - containerPort: 4000
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 4000
                      initialDelaySeconds: 30
                      periodSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: 4000
                      initialDelaySeconds: 10
                      periodSeconds: 5
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "250m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: event-management
spec:
    selector:
        app: backend
    ports:
        - port: 4000
          targetPort: 4000
    type: ClusterIP

---
