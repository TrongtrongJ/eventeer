apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: event-management
spec:
    replicas: 3
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            # The API also runs the mail workers. After SIGTERM it finishes in-flight requests and the mail being
            # sent (enableShutdownHooks); the pod then gets this long before SIGKILL.
            terminationGracePeriodSeconds: 40
            containers:
                - name: backend
                  image: eventeer-api:0.1.0 # pin an immutable tag (never :latest)
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: PORT
                        value: "4000"
                      - name: FRONTEND_URL
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: frontend-url
                      - name: TRUST_PROXY
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: trust-proxy
                      - name: DB_HOST
                        value: postgres
                      - name: DB_PORT
                        value: "5432"
                      - name: DB_NAME
                        value: event_management
                      - name: DB_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: username
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: password
                      - name: REDIS_HOST
                        value: redis
                      - name: REDIS_PORT
                        value: "6379"
                      - name: STRIPE_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                name: stripe-secret
                                key: secret-key
                      - name: STRIPE_WEBHOOK_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: stripe-secret
                                key: webhook-secret
                      - name: SMTP_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: smtp-host
                      - name: SMTP_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: smtp-port
                      - name: SMTP_USER
                        valueFrom:
                            secretKeyRef:
                                name: smtp-secret
                                key: username
                      - name: SMTP_PASS
                        valueFrom:
                            secretKeyRef:
                                name: smtp-secret
                                key: password
                      - name: EMAIL_FROM
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: email-from
                      - name: FEATURE_EMAIL_ENABLED
                        value: "true"
                      - name: FEATURE_PAYMENT_ENABLED
                        value: "true"
                      - name: GOOGLE_CLIENT_ID
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: google-client-id
                                optional: true
                      - name: GOOGLE_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: google-client-secret
                                optional: true
                      - name: GOOGLE_REDIRECT_URI
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: google-redirect-uri
                      - name: GITHUB_CLIENT_ID
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: github-client-id
                                optional: true
                      - name: GITHUB_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: github-client-secret
                                optional: true
                      - name: GITHUB_REDIRECT_URI
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: github-redirect-uri
                      - name: FACEBOOK_APP_ID
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: facebook-app-id
                                optional: true
                      - name: FACEBOOK_APP_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: oauth-secret
                                key: facebook-app-secret
                                optional: true
                      - name: FACEBOOK_REDIRECT_URI
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: facebook-redirect-uri
                  ports:
                      - containerPort: 4000
                  lifecycle:
                      preStop:
                          # Let the Service stop routing here before SIGTERM, so no request lands on a closing server.
                          exec:
                              command: ["sleep", "5"]
                  # Liveness must not depend on Postgres or Redis: the API degrades without them (session cache,
                  # circuit breakers, queued mail), and restarting every pod during a dependency blip makes it worse.
                  livenessProbe:
                      httpGet:
                          path: /health/ready
                          port: 4000
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 3
                  # Readiness does ping Postgres (/health): a pod that cannot reach the database leaves rotation.
                  # A Redis outage is reported in the body but does not fail it, since the API still serves.
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 4000
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "250m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: event-management
spec:
    selector:
        app: backend
    ports:
        - port: 4000
          targetPort: 4000
    type: ClusterIP

---
