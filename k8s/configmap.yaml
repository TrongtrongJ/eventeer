apiVersion: v1
kind: ConfigMap
metadata:
    name: backend-config
    namespace: event-management
data:
    # https is REQUIRED in production (auth cookies are Secure). Same host as the web app, so the
    # session cookies are first-party. See ingress.yaml: the API is served under /api.
    frontend-url: https://event-management.example.com
    trust-proxy: "1"
    smtp-host: smtp.gmail.com
    smtp-port: "587"
    # Event image uploads (direct-to-S3). Placeholders: replace with your own bucket/region/domain.
    # s3-public-base-url is the CloudFront domain from terraform/main.tf (must be https in production).
    s3-bucket: your-eventeer-images-bucket
    s3-region: your-aws-region
    s3-public-base-url: https://your-distribution-id.cloudfront.net
