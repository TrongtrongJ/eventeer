apiVersion: v1
kind: ConfigMap
metadata:
    name: backend-config
    namespace: event-management
data:
    # https is REQUIRED in production (auth cookies are Secure). Same host as the web app, so the
    # session cookies are first-party. See ingress.yaml: the API is served under /api.
    frontend-url: https://event-management.example.com
    trust-proxy: "1"
    smtp-host: smtp.gmail.com
    smtp-port: "587"
    # Must be an address the SMTP account may send as (Gmail rewrites or rejects anything else).
    email-from: noreply@event-management.example.com
    # OAuth callbacks are served under /api (see ingress.yaml). Register these exact URLs with each provider.
    google-redirect-uri: https://event-management.example.com/api/auth/oauth/google/callback
    github-redirect-uri: https://event-management.example.com/api/auth/oauth/github/callback
    facebook-redirect-uri: https://event-management.example.com/api/auth/oauth/facebook/callback
