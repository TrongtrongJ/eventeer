# The backend's identity for AWS. On EKS, IRSA maps this ServiceAccount to an IAM role so pods get
# short-lived S3 credentials with no keys stored anywhere. The role needs the same S3 permissions as
# the ECS task role in terraform/main.tf (aws_iam_role_policy.event_images_access).
#
# Replace the account id and role name. Other clusters can drop the annotation and use
# k8s/secrets.example.yaml's aws-s3-secret instead.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: backend
    namespace: event-management
    annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/your-eventeer-api-role
