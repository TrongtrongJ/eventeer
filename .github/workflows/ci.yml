name: CI

# Pull requests: lint + unit tests + build run in parallel; only if ALL pass do the e2e jobs run.
# Push to main (i.e. after a merge): the same pipeline runs again on the merged result, then the
# Docker images are built and published. Nothing is deployed automatically.
on:
    pull_request:
    push:
        branches: [main]

# A new push to a PR supersedes the previous run. Never cancel runs on main.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1
    YARN_ENABLE_TELEMETRY: 0

jobs:
    # ── Stage 1: parallel, fast feedback ───────────────────────────────────────
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: yarn lint
            - run: yarn typecheck
            - run: yarn lint:deps # architecture rules (dependency-cruiser)

    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: yarn test

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: yarn build

    # ── Stage 2: only runs when every job above passed (`needs`) ───────────────
    e2e-api:
        needs: [lint, unit, build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Real Postgres + Redis (matches apps/backend/.env.test). The suite creates and wipes
        # its own *_test database and refuses to run against any other name.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 10
            redis:
                image: redis:7-alpine
                ports: ["6379:6379"]
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s --health-timeout 3s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: yarn test:e2e

    e2e-web:
        needs: [lint, unit, build]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: yarn workspace @eventeer/web exec playwright install --with-deps chromium
            # The web app runs against mocked API responses (MOCK_API=1): no backend needed.
            - run: yarn test:e2e:web
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces
                  path: apps/frontend/test-results
                  retention-days: 7

    # ── Stage 3: after a merge to main only ────────────────────────────────────
    publish-images:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [e2e-api, e2e-web]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - name: api
                      dockerfile: apps/backend/Dockerfile
                    - name: web
                      dockerfile: apps/frontend/Dockerfile
        steps:
            - uses: actions/checkout@v4
            # An unset variable becomes an EMPTY build-arg, which overrides the Dockerfile default and
            # fails deep inside `next build`. Fail early with a clear message instead.
            - name: Require build-time URLs
              env:
                  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
                  NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
              run: |
                  for v in NEXT_PUBLIC_API_URL NEXT_PUBLIC_WS_URL; do
                    [ -n "${!v}" ] || { echo "::error::Set the Actions variable $v (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
                  done
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Lower-cases the repository name (GHCR requires it) and tags with the commit SHA.
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
                  tags: type=sha,format=long
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,scope=${{ matrix.name }},mode=max
                  # NEXT_PUBLIC_* are baked in at build time (ignored by the api image).
                  # Set these under Settings > Secrets and variables > Actions > Variables.
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
                      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
